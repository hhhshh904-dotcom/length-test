<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jj长度测量器 📏</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; padding: 0 15px; }
        #preview { max-width: 100%; height: auto; max-height: 300px; margin-top: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .upload-btn { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .upload-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        /* 进度条外框 */
        .progress-container {
            width: 80%; max-width: 400px; height: 20px; 
            background-color: #e0e0e0; border-radius: 10px; 
            margin: 20px auto; overflow: hidden; display: none;
        }
        /* 进度条本体 */
        .progress-bar {
            height: 100%; width: 0%; 
            background-color: #4CAF50; 
            transition: width 0.1s linear; /* 丝滑移动 */
        }
        
        #statusText { font-size: 14px; margin-top: 10px; color: #555; }
        #result { color: #FF5722; font-weight: bold; margin-top: 15px; min-height: 30px; }
        .warning { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>jj长度测量器📏</h1>
    <p class="warning">初次加载受网速影响，请勿切屏！</p>

    <div id="statusText">正在制作尺子...</div>
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <br>
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <button class="upload-btn" id="customUploadBtn" onclick="document.getElementById('imageInput').click();" disabled>
        尺子未准备好...
    </button>
    
    <br>
    <img id="preview" style="display:none;">
    <h2 id="result"></h2>

    <script src="app.js"></script>

</body>
</html>
